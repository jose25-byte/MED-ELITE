name: med_elite
version: 0.1.0+1
description: MED ELITE - biblioteca medica y buscador cientifico (prototipo)
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/subjects.json
    - assets/data/topics.json
    - assets/data/resources.json
    - assets/data/flashcards.json
