
name: APK Android de prueba

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MED_ELITE_Flutter

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear estructura Android
        run: flutter create --project-name med_elite --platforms=android --org com.medelite .

      - name: Configurar Internet
        run: python3 tools/patch_android.py

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: med-elite-debug-apk
          path: MED_ELITE_Flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
